name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Deliberately NOT using `services:` containers.
    #
    # A service container cannot be given a command — GitHub inserts its
    # options before the image name and never passes arguments — so MinIO
    # starts bare, prints its usage, and exits. Beyond that specific failure,
    # duplicating the stack in two places means CI and local development drift.
    # Running the same docker-compose.yml a developer runs removes both
    # problems at once.

    env:
      DATABASE_URL: postgres://tricky_app:tricky_app@localhost:5433/tricky
      DATABASE_ADMIN_URL: postgres://tricky:tricky@localhost:5433/tricky
      DATABASE_APP_ROLE: tricky_app
      DATABASE_APP_PASSWORD: tricky_app
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: tricky
      STORAGE_ACCESS_KEY: tricky
      STORAGE_SECRET_KEY: trickytricky

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Containers up, roles created, migrations applied, storage bucket made,
      # seed run — the same command, in the same order, as a developer's first
      # checkout.
      - name: Bring up the stack
        run: pnpm dev:all

      # The committed types must match what the migrations actually produce.
      # Regenerating and diffing catches a migration that shipped without its
      # type update; that drift is invisible until a query breaks at runtime.
      - name: Check for type drift
        run: |
          pnpm db:generate-types
          if ! git diff --quiet -- lib/db/types.ts; then
            echo "::error::lib/db/types.ts is out of date. Run 'pnpm db:generate-types' and commit the result."
            git diff -- lib/db/types.ts
            exit 1
          fi
          echo "types are in sync"

      - name: Typecheck
        run: pnpm typecheck

      - name: Row-level security
        run: pnpm test:rls

      - name: Build
        run: pnpm build

      # A down() that has never been executed is a down() that does not work,
      # and it is only ever needed under pressure.
      - name: Migrations are reversible
        run: |
          pnpm db:migrate:down
          pnpm db:migrate:down
          pnpm db:migrate:latest

      - name: Build the runtime and migrate images
        run: |
          docker build -t tricky:app .
          docker build --target migrate -t tricky:migrate .

      - name: Container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
